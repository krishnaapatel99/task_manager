events {}

http {
    upstream auth_service {
        server auth_api:8000;
    }

    upstream tasks_service {
        least_conn;
        server tasks_api_1:8000;
        server tasks_api_2:8000;
    }

    server {
        listen 80;

        location = /docs {
            default_type text/html;
            return 200 '<!DOCTYPE html><html><head><title>Gateway Docs</title><style>body{font-family:Arial,sans-serif;padding:32px;background:#f8fafc}a{display:block;margin:8px 0;color:#2563eb;text-decoration:none;font-weight:600}</style></head><body><h1>API Gateway Docs</h1><a href="/docs/auth">Auth Service Docs</a><a href="/docs/tasks">Tasks Service Docs</a><a href="/openapi/auth.json">Auth OpenAPI JSON</a><a href="/openapi/tasks.json">Tasks OpenAPI JSON</a></body></html>';
        }

        location = /docs/auth {
            proxy_pass http://auth_service/docs;
        }

        location = /docs/tasks {
            proxy_pass http://tasks_service/docs;
        }

        location = /openapi/auth.json {
            proxy_pass http://auth_service/openapi.json;
        }

        location = /openapi/tasks.json {
            proxy_pass http://tasks_service/openapi.json;
        }

        location /api/v1/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/tasks/ {
            proxy_pass http://tasks_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health/auth {
            proxy_pass http://auth_service/health;
        }

        location /health/tasks {
            proxy_pass http://tasks_service/health;
        }
    }
}
